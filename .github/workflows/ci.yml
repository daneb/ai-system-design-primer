name: primer

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches reviews that go overdue and links that rot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Front matter and review dates
        run: python3 scripts/primer.py check
      - name: README TOC and progress are current
        run: python3 scripts/primer.py readme --check
      - name: Flashcards build
        run: python3 scripts/primer.py flashcards
      - uses: actions/upload-artifact@v4
        with:
          name: flashcards
          path: build/flashcards.tsv

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 --exclude-path templates './**/*.md'
