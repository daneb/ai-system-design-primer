<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>Animated: six prompt tokens enter the model together in one prefill pass, which keeps the arithmetic busy, fills six KV-cache entries and produces the first token. Then decode writes one token per step; each step reads all 16 GB of weights and the KV cache from memory, adds one cache entry and one output token. The first two output tokens are hidden reasoning, billed as output; the rest is the visible answer.</title>
