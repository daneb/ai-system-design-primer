<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>Animated: a user asks for their balance in euros. Your code sends the messages and tool definitions to the model, which replies with a tool call. Your code checks the schema and the user's permission, runs the tool and sends everything back with the result, which is untrusted input. A second tool call converts the currency. The model then gives the final answer. Each call resends the whole conversation, so input tokens grow from 1,200 to 1,480.</title>
