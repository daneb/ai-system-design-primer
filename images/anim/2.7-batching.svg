<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>Animated: four batch slots over 16 decode steps. With static batching, requests A to D start together; slots whose request finishes early sit idle until the longest, B, finishes at step 14, so only 4 requests finish and 36% of slot-steps are idle. With continuous batching, a waiting request joins as soon as a slot frees up, so 8 requests finish and no slot is idle.</title>
