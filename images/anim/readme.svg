<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>Animated: a request travels from the user through the gateway (3.1), input guardrails (3.2) and context engineering (3.3), then retrieval (3.4 to 3.6) and a workflow or agent (3.9 to 3.11), reaches the model layer (3.7, 3.8), and returns through output checks (3.12) to the user. Caching, asynchronism, evals, observability and security (3.13 to 3.17) support the whole path.</title>
