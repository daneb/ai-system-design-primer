# Link checker settings (lychee reads this file automatically; CI also passes its own flags).

# Retry flaky hosts and treat rate limiting as a pass. EUR-Lex answers 202 (Accepted) to checkers
# while it queues the page; the page is there.
max_retries = 2
timeout = 30
accept = ["200", "202", "206", "429"]

# research/ holds dated feasibility notes kept as a record; its links are evidence of what was read
# then, not reading for learners, so link rot there doesn't fail the build.
exclude_path = ["templates", "research"]

# Sites that block automated checkers (they answer 403 to CI but work in a browser).
# Before adding a site here, open the link by hand to confirm it is alive.
exclude = [
  '^https://help\.openai\.com/',
  '^https://(www\.)?openai\.com/',
  '^https://(www\.)?customerexperiencedive\.com/',
  '^https://(www\.)?canlii\.ca/',
  '^https://(www\.)?oreilly\.com/',
  '^https://(www\.)?axios\.com/',
  '^https://(www\.)?americanbar\.org/',
  # HAL (French open archive) sits behind Anubis proof-of-work bot protection, so checkers time out.
  '^https://([a-z-]+\.)?hal\.science/',
]
